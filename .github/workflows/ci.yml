name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run unit tests
        run: ./gradlew build

      # Runs on a Linux runner with a working Docker daemon, so Testcontainers can start the real
      # Postgres/Redis/Kafka these tests need — notably the row-level-security isolation checks,
      # which only mean anything against an actual database.
      - name: Run integration tests
        run: ./gradlew integrationTest

      # Republishes each failed test as a workflow annotation. Annotations are readable without
      # being signed in, unlike the raw job log and uploaded artifacts, which keeps a red build
      # diagnosable from the run page alone.
      - name: Surface test failures as annotations
        if: failure()
        run: |
          cat > /tmp/report_failures.py <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          found = False
          for path in glob.glob("build/test-results/**/*.xml", recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter("testcase"):
                  problems = list(case.findall("failure")) + list(case.findall("error"))
                  for problem in problems:
                      found = True
                      detail = "%s | %s" % (problem.get("message") or "", problem.text or "")
                      detail = " ".join(detail.split())[:1500]
                      print("::error::%s.%s :: %s" % (case.get("classname"), case.get("name"), detail))

          if not found:
              print("::error::No failing test cases found in build/test-results — the build likely "
                    "failed before or outside test execution (compilation, container startup, etc.)")
          PY
          python3 /tmp/report_failures.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
