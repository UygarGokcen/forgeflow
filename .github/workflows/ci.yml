name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run unit tests
        run: ./gradlew build

      # The Linux runner has a working Docker daemon, so Testcontainers can start the real
      # Postgres, Redis and Kafka these tests need. The row-level-security checks in particular
      # only mean something against a real database.
      - name: Run integration tests
        run: ./gradlew integrationTest

      # Reports each failed test as a workflow annotation. You need to be signed in to read the
      # raw job log or download the artifacts, but annotations are public, so a red build can
      # still be understood from the run page.
      - name: Surface test failures as annotations
        if: failure()
        run: |
          cat > /tmp/report_failures.py <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          def summarize(problem):
              """Spring's context failure messages start with a huge config dump and put the real
              cause at the end of the "Caused by" chain, so show the innermost causes first."""
              text = problem.text or ""
              causes = [ln.strip() for ln in text.splitlines() if ln.strip().startswith("Caused by:")]
              headline = " ".join((problem.get("message") or "").split())[:200]
              if causes:
                  return ("ROOT CAUSES: " + " >> ".join(causes[-4:]))[:1500]
              return (headline + " | " + " ".join(text.split()))[:1500]

          found = False
          for path in glob.glob("build/test-results/**/*.xml", recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter("testcase"):
                  for problem in list(case.findall("failure")) + list(case.findall("error")):
                      found = True
                      print("::error::%s.%s :: %s" % (
                          case.get("classname"), case.get("name"), summarize(problem)))

          if not found:
              print("::error::No failing test cases found in build/test-results — the build likely "
                    "failed before or outside test execution (compilation, container startup, etc.)")
          PY
          python3 /tmp/report_failures.py

      # The README tells people to start this with `docker-compose up`, so a broken Dockerfile
      # breaks the first thing anyone tries. Gradle passing doesn't catch that on its own.
      - name: Build Docker image
        run: docker build -t forgeflow-backend:ci .

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
